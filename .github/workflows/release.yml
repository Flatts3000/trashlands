name: Release

# Tag-driven release. Cut one with:
#   (bump pack/pack.toml version + update CHANGELOG.md, commit, then)
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# This builds the CurseForge export, creates a GitHub release with the zip and the
# matching CHANGELOG section, and uploads the file to CurseForge.
#
# Ported from ../sky-frogs/.github/workflows/release.yml, with two deliberate changes:
#   1. CurseForge game-version ids are RESOLVED FROM THE API, not hardcoded. Sky Frogs
#      pins [11779, 10150] (MC 1.21.1 + NeoForge); those are wrong for any other MC
#      version and go stale silently. See the resolve step for why the id lookup has to
#      filter on version TYPE.
#   2. CF_PROJECT_ID is a repo VARIABLE, not a hardcoded env value, so the project id can
#      be set once the CurseForge project is approved without editing this file.
#
# Repo settings consumed (both optional - the run degrades instead of failing):
#   secret  CF_API_TOKEN    the CurseForge *upload* token (same one in recompile/.env
#                           as CURSEFORGE_API_KEY - same author account)
#   var     CF_PROJECT_ID   the numeric project id from the CurseForge project page
# If either is unset the CurseForge step is skipped with a warning and the GitHub
# release still ships; upload the zip by hand or with `python tools/cf_release.py`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create GitHub releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false # no go.sum in this repo (packwiz is `go install`-ed); skip the cache restore

      # Pinned, NOT @latest. packwiz upstream commit 9066bf8 (#407, 2026-09-02) added a
      # `replace` directive to its go.mod, and `go install pkg@version` refuses any module
      # whose go.mod carries one:
      #
      #   The go.mod file for the module providing named packages contains one or
      #   more replace directives.
      #
      # That broke this step in both workflows the moment it landed upstream - nothing in
      # this repo changed. dfd8b68 is the commit immediately before it, and is itself
      # "Support neoforge for 26.1 and above" (#386), which is the support this pack needs.
      # Move the pin forward only to a commit whose go.mod has no replace directive.
      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@v0.0.0-20260218225342-dfd8b68a4796
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # packwiz-installer is a jar, and tools/check_pack_deps.py drives it to resolve
      # the pinned mods before reading their metadata.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Guard - pack.toml version matches the tag
        run: |
          pack_ver=$(grep -E '^version *= *' pack/pack.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$pack_ver" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::pack.toml version ($pack_ver) does not match tag (${{ steps.ver.outputs.version }}). Bump pack.toml before tagging."
            exit 1
          fi

      # A committed index.toml that does not match the committed pack files ships hashes
      # no file actually has, and packwiz-installer then rejects the very jars it just
      # downloaded. `packwiz refresh` is idempotent when the index is current, so any
      # diff here means someone edited the pack without running tools/pack_refresh.py.
      # Catching it at release time is the last chance before it reaches players.
      - name: Guard - committed index.toml is current
        run: |
          cd pack
          packwiz refresh
          cd ..
          if ! git diff --quiet -- pack/index.toml pack/pack.toml; then
            echo "::error::pack/index.toml (or pack.toml's index hash) was stale. Run 'python tools/pack_refresh.py' and commit the result."
            git --no-pager diff -- pack/index.toml pack/pack.toml
            exit 1
          fi
          echo "index is current."

      # Downloads every pinned jar and reads its neoforge.mods.toml. Catches a mod
      # whose required `neoforge [X,)` sits above the pack's pin - which NeoForge does
      # NOT warn about, it just declines to load the mod, so the pack ships looking
      # fine and missing something. v0.1.0's first lineup pinned 26.1.2.76 with JEI
      # needing [26.1.2.81,) and Balm [26.1.2.93,). Also runs on PRs (validate-pack.yml);
      # repeated here because shipping an unloadable pack is worse than a slow release.
      - name: Guard - pinned pack can actually load
        run: python3 tools/check_pack_deps.py

      - name: Build CurseForge export
        id: build
        run: |
          cd pack
          packwiz curseforge export
          zip=$(ls *.zip)
          echo "zip_path=pack/$zip" >> "$GITHUB_OUTPUT"
          echo "built: pack/$zip"
          # A manifest-only export contains no jars. If one appears, a mod was added from
          # a non-CurseForge source and packwiz inlined the jar into overrides/ - which
          # CurseForge rejects on redistribution grounds. Fail here, not in moderation.
          if unzip -l "$zip" | grep -qi '\.jar$'; then
            echo "::error::the export contains .jar files. Every mod must be sourced from CurseForge (packwiz curseforge add), or CF will reject the upload."
            unzip -l "$zip" | grep -i '\.jar$'
            exit 1
          fi

      # The server pack is a REAL bundle: it contains the jars, unlike the client
      # export which is a manifest CurseForge resolves itself. That is how server
      # packs work, and it is why the no-jar assertion above is scoped to the
      # client export only - dist/ is deliberately full of jars.
      - name: Build server pack
        id: server
        run: |
          python3 tools/build_server.py --out build/server
          zip=$(ls dist/trashlands-server-*.zip)
          echo "zip_path=$zip" >> "$GITHUB_OUTPUT"
          echo "built: $zip"

      # Cheap and deterministic: prove the side tags did what they claim before
      # spending four minutes booting a JVM. A client mod reaching a server is the
      # failure this whole side-tag split exists to prevent.
      # Derived from pack/mods/*.pw.toml rather than a hand-written name list: each
      # client-tagged mod is checked by the `filename` packwiz already records, so a
      # newly added client mod is covered with no edit here. A name list would drift
      # from the jars - "mouse-tweaks" never matches MouseTweaks-neoforge-mc26.1.jar,
      # which is exactly the false negative this shape removes.
      - name: Guard - no client-only mods in the server pack
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          installed = {p.name for p in pathlib.Path("build/server/mods").glob("*.jar")}
          client, leaked = 0, []
          for toml in sorted(pathlib.Path("pack/mods").glob("*.pw.toml")):
              text = toml.read_text(encoding="utf-8")
              side = re.search(r'^side\s*=\s*"([^"]+)"', text, re.M)
              name = re.search(r'^filename\s*=\s*"([^"]+)"', text, re.M)
              if not side or side.group(1) != "client":
                  continue
              client += 1
              if name and name.group(1) in installed:
                  leaked.append(name.group(1))

          print(f"client-tagged mods: {client}, jars installed for the server: {len(installed)}")
          for f in leaked:
              print(f"::error::client-only mod '{f}' was installed into the server pack")
          if leaked:
              sys.exit(1)
          if client == 0:
              sys.exit("::error::no mod is tagged side=client - the side audit has been lost")
          if len(installed) < 20:
              sys.exit(f"::error::only {len(installed)} server mods - the side tags look wrong the other way")
          PY

      # The dependency guard above resolves with `-s both`, so it audits the union of
      # client and server mods and cannot see a server-side break caused by the side
      # split. This PR demoted searchables, melody and konkrete to client; if a
      # server mod had required one, the union pass would still find it present. So
      # audit the ACTUAL server set too - same tool, pointed at what got installed.
      - name: Guard - the server's own mod set can load
        run: python3 tools/check_pack_deps.py --mods-dir build/server/mods

      # The only thing that actually proves the side split: boot it. A client mod
      # that slipped through crashes NeoForge at load, and nothing earlier catches
      # that.
      - name: Smoke test - the server boots
        run: |
          cd build/server
          sed -i 's/^eula=false/eula=true/' eula.txt
          nf=$(grep -m1 '^NEOFORGE=' setup.sh | cut -d'"' -f2)
          echo "installing NeoForge $nf ..."
          curl -fsSL -o installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/$nf/neoforge-$nf-installer.jar"
          java -jar installer.jar --installServer > install.log 2>&1 \
            || { tail -40 install.log; exit 1; }
          echo "booting ..."
          # stdin comes from a FIFO we hold open, so the server can be told to `stop`.
          # That matters: region files are written on autosave (6000 ticks) or on
          # shutdown, never at `Done (`. The old `kill "$pid"` could not produce
          # either - NeoForge's run.sh calls java WITHOUT exec, so $! is the wrapper
          # shell and killing it orphans the JVM, which then never saves. The world
          # check below would have found no region files at all and warned forever,
          # a gate that always passes.
          mkfifo srv_cmd
          bash run.sh nogui < srv_cmd > boot.log 2>&1 &
          pid=$!
          exec 3> srv_cmd
          ok=0
          for i in $(seq 1 96); do
            if grep -q 'Done (' boot.log 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            exec 3>&-
            # Same treatment as the success path below: killing only $pid leaves the
            # JVM running and appending to boot.log while we tail it, and leaves a
            # live server on the runner.
            pkill -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "::error::the server did not reach 'Done' - see the log below."
            tail -120 boot.log
            exit 1
          fi
          echo "stopping cleanly so the world is flushed to disk ..."
          # If the server died between `Done (` and here, the FIFO has no reader and
          # this write raises SIGPIPE against THIS shell - under `bash -e` the step
          # dies at 141 with no annotation and no log tail, which reads as an
          # unexplained CI failure rather than "the server crashed after Done".
          if kill -0 "$pid" 2>/dev/null; then
            echo "stop" >&3 2>/dev/null || echo "::warning::could not send stop (server already gone)."
          else
            echo "::warning::server exited on its own before it could be stopped."
            tail -60 boot.log
          fi
          for i in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          exec 3>&-
          # Belt and braces. pkill -P selects java by PARENT pid, which reaches it
          # because run.sh spawns it directly - this is not a process-group kill and
          # does not claim to be. A forced kill can interrupt a shutdown save, and a
          # half-written region file is caught by the tool's truncated-file check,
          # which withholds the verdict rather than failing the release. That is the
          # right outcome here: a server we had to kill has not proven anything.
          if kill -0 "$pid" 2>/dev/null; then
            echo "::warning::server did not stop within 120s; forcing it down."
            pkill -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            sleep 15
          fi
          wait "$pid" 2>/dev/null || true
          grep -qE "All chunks are saved|Saving chunks for level|ThreadedAnvilChunkStorage" boot.log             && echo "save confirmed in boot.log"             || echo "::warning::no save line in boot.log - the terrain check may find nothing."
          # Booting is NOT proof the world type took. An unknown level-type does not
          # crash: it resolves against the WORLD_PRESET registry and falls back to
          # minecraft:normal, so a renamed preset gives every server an ordinary
          # overworld with CI green.
          #
          # This reads the TERRAIN, not level.dat. Three earlier attempts read
          # level.dat and all three were looking in the wrong file - the v0.8.0 log
          # settled it: 2436 bytes holding one namespaced id, minecraft:overworld,
          # and no generator id of any namespace. A vanilla world would have to
          # record its generator somewhere too, so that absence proved nothing.
          #
          # The terrain check looks for any recompile: id in the region files, which
          # hits the per-section biome palette and so appears in EVERY generated
          # chunk - not just where a garbage mound happened to spawn.
          #
          # exit 1 (world is wrong) is fatal. exit 2 (could not read any chunk) is a
          # warning, because "I could not tell" must never be reported as "it failed"
          # - that conflation is what failed a release whose pack was fine.
          echo "--- world type check ---"
          grep '^level-type' server.properties || echo "(no level-type line)"
          # Absolute: this step ran `cd build/server`, so a repo-relative path
          # resolves under the server dir and silently misses.
          set +e
          python3 "$GITHUB_WORKSPACE/tools/inspect_world_terrain.py" world
          terrain_rc=$?
          set -e
          if [ "$terrain_rc" = "1" ]; then
            echo "::error::the server world is not a Trashlands world. Refusing to release."
            exit 1
          elif [ "$terrain_rc" != "0" ]; then
            echo "::warning::terrain check could not run (exit $terrain_rc) - world type UNVERIFIED."
          fi
          echo "server booted and generated a world."

      - name: Extract changelog section
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # The lookahead must also accept end-of-file. Sky Frogs' version requires a
          # FOLLOWING "## [" section, which the very first release does not have - so
          # v0.1.0 would silently fall back to the bare "Release 0.1.0" string.
          m = re.search(r"## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.S)
          cl = (m.group(1).strip() if m else f"Release {version}")
          open("release_notes.md", "w", encoding="utf-8").write(cl)
          print("changelog chars:", len(cl))
          PY

      # Build the CurseForge metadata. The game-version ids are looked up rather than
      # hardcoded, because a single MC version name exists MULTIPLE times in CurseForge's
      # version list under different types, and only one of them is valid for a modpack:
      #
      #   26.1.2 -> id 16082 (type 83806, slug "minecraft-26-1")   <- correct
      #          -> id 16085 (type 1, the mod-class version)        -> errorCode 1009
      #          -> id 16130 (type 615, slug "addons")              -> errorCode 1009
      #
      # So matching on name alone picks the wrong id roughly two times in three. The
      # filter is: the version's type slug must start with "minecraft-", which selects the
      # MC release-series type and nothing else. NeoForge comes from the "modloader" type.
      #
      # A Java-version id must NOT be sent for a modpack - CurseForge rejects it. Java is
      # implied by the loader. (Mod uploads are the opposite; see recompile's release.yml.)
      - name: Build CurseForge metadata
        id: cfmeta
        if: vars.CF_PROJECT_ID != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::CF_API_TOKEN not set - skipping CurseForge metadata build."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          token = os.environ["CF_API_TOKEN"]
          version = os.environ["VERSION"]

          pack = open("pack/pack.toml", encoding="utf-8").read()
          mc_version = re.search(r'^minecraft\s*=\s*"([^"]+)"', pack, re.M).group(1)

          def api(path):
              req = urllib.request.Request(
                  f"https://minecraft.curseforge.com/api/game/{path}",
                  headers={"X-Api-Token": token})
              return json.load(urllib.request.urlopen(req))

          types = api("version-types")
          versions = api("versions")

          # Type ids for the MC release-series types and for the modloader type.
          # Snapshot types are excluded by substring, not by an exact slug: the slug
          # carries the series ("minecraft-26-snapshots"), so an equality check would
          # silently stop matching on the next MC major.
          mc_type_ids = {t["id"] for t in types
                         if (t.get("slug") or "").startswith("minecraft-")
                         and "snapshot" not in (t.get("slug") or "")}
          loader_type_ids = {t["id"] for t in types if (t.get("slug") or "") == "modloader"}

          mc_id = next((v["id"] for v in versions
                        if v.get("name") == mc_version
                        and v.get("gameVersionTypeID") in mc_type_ids), None)
          loader_id = next((v["id"] for v in versions
                            if v.get("name") == "NeoForge"
                            and v.get("gameVersionTypeID") in loader_type_ids), None)

          # Fail HERE rather than on the upload. CurseForge's 400 arrives after the file
          # has already been transferred and its errorCode says nothing about which id was
          # bad unless you already know the answer.
          if mc_id is None:
              sys.exit(f"::error::no CurseForge modpack-class id for Minecraft {mc_version}")
          if loader_id is None:
              sys.exit("::error::no CurseForge id resolved for the NeoForge modloader")

          print(f"resolved gameVersions: MC {mc_version}={mc_id}, NeoForge={loader_id}")

          json.dump({
              "changelog": open("release_notes.md", encoding="utf-8").read(),
              "changelogType": "markdown",
              "displayName": f"Trashlands {version}",
              "gameVersions": [mc_id, loader_id],
              # 0.x is an alpha: the pack is unfinished and says so on the tin.
              "releaseType": "alpha" if version.startswith("0.") else "release",
          }, open("cf_meta.json", "w", encoding="utf-8"))
          PY
          echo "ready=1" >> "$GITHUB_OUTPUT"

      # Deliberately AFTER the metadata build and BEFORE the upload. Resolving the
      # game-version ids is the step that hard-fails on a CurseForge-side surprise, and
      # publishing the GitHub release first would mean that failure lands on a tag that
      # has already shipped - which is exactly how Recompile v0.4.0 went out before its
      # CurseForge upload came back "errorCode 1021". Everything that can fail cheaply
      # now fails before anything is public.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ steps.ver.outputs.version }}" in
            0.*|*-*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            $prerelease \
            "${{ steps.build.outputs.zip_path }}" \
            "${{ steps.server.outputs.zip_path }}"

      - name: Upload to CurseForge
        id: cf
        if: steps.cfmeta.outputs.ready == '1'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          resp=$(curl -s -w '\n%{http_code}' -X POST \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=<cf_meta.json" \
            -F "file=@${{ steps.build.outputs.zip_path }}" \
            "https://minecraft.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file")
          body=$(printf '%s' "$resp" | sed '$d')
          code=$(printf '%s' "$resp" | tail -n1)
          echo "HTTP $code: $body"
          if [ "$code" != "200" ]; then
            echo "::error::CurseForge upload failed (HTTP $code): $body"
            exit 1
          fi
          fileid=$(printf '%s' "$body" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          url="https://www.curseforge.com/minecraft/modpacks/trashlands/files/$fileid"
          echo "fileid=$fileid" >> "$GITHUB_OUTPUT"
          echo "### CurseForge file [$fileid]($url)" >> "$GITHUB_STEP_SUMMARY"

      # The server pack rides along as a CHILD of the client file (parentFileID), which
      # is what puts it under "Additional Files" on the file page.
      #
      # It does NOT make CurseForge treat it as a *Server Pack*. Those are two different
      # things, and the difference is what host one-click deploys read:
      #
      #   additional file -> visible on the file page, downloadable by a human
      #   server pack     -> the above, PLUS isServerPack/serverPackFileId in CF's Core
      #                      API, which BisectHosting, Nodecraft, Pterodactyl eggs and
      #                      itzg/docker-minecraft-server AUTO_CURSEFORGE all read
      #
      # The upload API cannot set that flag. `upload-file` accepts only changelog /
      # changelogType / displayName / parentFileID / gameVersions / releaseType /
      # isMarkedForManualRelease / relations; sending isServerPack is silently ignored
      # (henkelmax/upload-curseforge-modpack-action#1, confirmed by CF support). So the
      # flag is a manual Authors Console step, once per release, and the step below
      # exists to make sure nobody forgets it. Sky Frogs shipped 29 untyped files.
      - name: Upload server pack to CurseForge
        id: cfserver
        if: steps.cf.outputs.fileid != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          PARENT: ${{ steps.cf.outputs.fileid }}
        run: |
          python3 - <<'PY'
          import json, os
          json.dump({
              "changelog": f"Dedicated server pack for Trashlands {os.environ['VERSION']}.",
              "changelogType": "text",
              "displayName": f"Trashlands Server {os.environ['VERSION']}",
              "parentFileID": int(os.environ["PARENT"]),
              "releaseType": "alpha" if os.environ["VERSION"].startswith("0.") else "release",
          }, open("cf_server_meta.json", "w", encoding="utf-8"))
          PY
          resp=$(curl -s -w '\n%{http_code}' -X POST \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=<cf_server_meta.json" \
            -F "file=@${{ steps.server.outputs.zip_path }}" \
            "https://minecraft.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file")
          body=$(printf '%s' "$resp" | sed '$d')
          code=$(printf '%s' "$resp" | tail -n1)
          echo "HTTP $code: $body"
          if [ "$code" != "200" ]; then
            echo "::error::server pack upload failed (HTTP $code): $body"
            exit 1
          fi

      - name: Remind - type the server pack by hand
        if: steps.cfserver.outcome == 'success'
        run: |
          {
            echo "## One manual step left"
            echo
            echo "The server pack uploaded as an additional file, but CurseForge's upload API"
            echo "**cannot** mark it as a Server Pack. Until it is typed, host one-click deploys"
            echo "(BisectHosting, Nodecraft, Pterodactyl, AUTO_CURSEFORGE) cannot see it."
            echo
            echo "Authors Console -> Trashlands -> Files -> the \`${GITHUB_REF_NAME}\` file"
            echo "-> the attached server file -> **Additional File Info** -> \`Server Pack\`."
            echo
            echo "Then verify: \`python tools/check_server_pack_flag.py\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Set the server file's type to 'Server Pack' in the Authors Console - the API cannot do it."

      # The GitHub release is the real artifact channel until the CurseForge project is
      # approved, so a missing project id is a notice, not a failure. Once CF_PROJECT_ID
      # is set this step goes quiet.
      - name: Note - CurseForge upload skipped
        if: vars.CF_PROJECT_ID == '' || steps.cfmeta.outputs.ready != '1'
        run: |
          {
            echo "## CurseForge upload skipped"
            echo
            echo "\`${GITHUB_REF_NAME}\` shipped to GitHub Releases only."
            echo
            echo "To enable CurseForge uploads:"
            echo "1. Create the project (see \`docs/cf_submission_checklist.md\`)."
            echo "2. \`gh variable set CF_PROJECT_ID --body '<numeric id>'\`"
            echo "3. \`gh secret set CF_API_TOKEN\` (the CurseForge upload token)."
            echo
            echo "Meanwhile, upload by hand: \`python tools/cf_release.py --zip <path> --project <id>\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::CurseForge upload skipped - CF_PROJECT_ID variable or CF_API_TOKEN secret not set."

      # Full release notes -> the Discord #changelog channel. The #announcements
      # GitHub-release embed truncates long bodies, so this posts the whole CHANGELOG
      # section, chunked under Discord's 2000-char message cap on line boundaries.
      #
      # The webhook is Terraform-managed in ../sky-frogs-community
      # (discord_webhook.changelog); the secret comes from
      # `terraform output -raw changelog_webhook_url`. Shared with Sky Frogs and
      # Ribbit Survival - one #changelog carries every pack.
      #
      # `if: always()` so the notes still land when the CurseForge upload failed: a
      # release that shipped to GitHub is still a release players want to read about.
      - name: Post release notes to Discord changelog
        if: always()
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$DISCORD_CHANGELOG_WEBHOOK" ]; then
            echo "::warning::DISCORD_CHANGELOG_WEBHOOK not set - skipping the Discord changelog post."
            exit 0
          fi
          if [ ! -f release_notes.md ]; then
            echo "::warning::release_notes.md missing - the changelog extract step did not run. Skipping."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, time, urllib.request

          hook = os.environ["DISCORD_CHANGELOG_WEBHOOK"]
          version = os.environ["VERSION"]
          notes = open("release_notes.md", encoding="utf-8").read().strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "Flatts3000/trashlands")
          gh_url = f"https://github.com/{repo}/releases/tag/v{version}"

          header = f"# Trashlands v{version}\n<{gh_url}>"
          chunks, cur = [header], ""
          for line in notes.splitlines():
              if len(cur) + len(line) + 1 > 1900:   # headroom under the 2000 cap
                  chunks.append(cur)
                  cur = line
              else:
                  cur = f"{cur}\n{line}" if cur else line
          if cur:
              chunks.append(cur)

          for chunk in chunks:
              payload = json.dumps({"content": chunk, "allowed_mentions": {"parse": []}}).encode()
              req = urllib.request.Request(
                  hook, data=payload,
                  headers={"Content-Type": "application/json", "User-Agent": "trashlands-release"})
              with urllib.request.urlopen(req) as resp:
                  resp.read()
              time.sleep(1)   # stay friendly with the webhook rate limit
          print(f"posted {len(chunks)} message(s) to #changelog")
          PY
