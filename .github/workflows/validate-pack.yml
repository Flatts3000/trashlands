name: Validate Pack

# Proves the pinned pack can actually load.
#
# packwiz resolves files; it never opens a jar. So nothing in the normal workflow
# notices when a mod declares `neoforge [X,)` above the pack's pin - and NeoForge
# does not warn about that, it silently refuses to load the mod. The pack boots
# looking fine, minus a mod.
#
# That is how the first Trashlands lineup pinned 26.1.2.76 while JEI needed
# [26.1.2.81,) and Balm needed [26.1.2.93,). JEI is core to the pack. Sky Frogs
# hit the same class of bug twice via Apotheosis, and carries the check as a
# heredoc in its release checklist that a human has to remember to paste.
#
# tools/check_pack_deps.py downloads every pinned jar and reads its
# neoforge.mods.toml. It runs here on any change to the pinned set, and again in
# release.yml, because shipping a pack that boots with mods missing is the worst
# outcome available.

on:
  pull_request:
    paths:
      - "pack/pack.toml"
      - "pack/mods/**"
      - "tools/check_pack_deps.py"
      - "tools/test_check_pack_deps.py"
      - "tools/packwiz-installer.jar"
      - "tools/inspect_world_terrain.py"
      - "tools/test_inspect_world_terrain.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/validate-pack.yml"
  push:
    branches: [main]
    paths:
      - "pack/pack.toml"
      - "pack/mods/**"
      - "tools/check_pack_deps.py"
      - "tools/test_check_pack_deps.py"
      - "tools/packwiz-installer.jar"
      - "tools/inspect_world_terrain.py"
      - "tools/test_inspect_world_terrain.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # Pinned, NOT @latest. packwiz upstream commit 9066bf8 (#407, 2026-09-02) added a
      # `replace` directive to its go.mod, and `go install pkg@version` refuses any module
      # whose go.mod carries one:
      #
      #   The go.mod file for the module providing named packages contains one or
      #   more replace directives.
      #
      # That broke this step in both workflows the moment it landed upstream - nothing in
      # this repo changed. dfd8b68 is the commit immediately before it, and is itself
      # "Support neoforge for 26.1 and above" (#386), which is the support this pack needs.
      # Move the pin forward only to a commit whose go.mod has no replace directive.
      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@v0.0.0-20260218225342-dfd8b68a4796
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # First, and with no setup: it needs nothing but Python, and it guards the
      # check that decides whether a release ships at all. A wrong exit code here
      # either blocks a good release or, worse, waves a vanilla world through.
      - name: Test the world-type gate
        run: python tools/test_inspect_world_terrain.py

      # The guard's own version-comparison tests, run before it. Two real bugs
      # turned up the first time anyone wrote these: an exclusive lower bound
      # `(x,)` read as inclusive, which let a pin sitting exactly on it through,
      # and a bare version range reported as "too old", which fails a good
      # release. Both are one boundary in a tuple comparison that looks right.
      - name: Test the dependency guard
        run: python tools/test_check_pack_deps.py

      - name: Audit dependencies and loader pin
        run: python tools/check_pack_deps.py
